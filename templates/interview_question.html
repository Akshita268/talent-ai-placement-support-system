{% extends "dashboard_student.html" %}

{% block body %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
        <!-- Question Card -->
        <div class="card border-0 shadow-sm p-4 bg-glass mb-4">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-4">
                    <span class="badge bg-indigo rounded-pill px-3 py-1.5 fs-6">Question {{ question_number }}</span>
                    <span class="text-secondary small"><i class="bi bi-robot"></i> AI Assisted</span>
                </div>
                
                <h3 class="h4 text-light mb-4" style="line-height: 1.5; font-family: 'Playfair Display', serif;">{{ question }}</h3>

                <!-- Instructions Tip Box -->
                <div class="p-3 bg-dark border border-secondary border-opacity-10 rounded-3 mb-4">
                    <span class="text-indigo small fw-bold d-block mb-1"><i class="bi bi-lightbulb-fill"></i> Tip for structuring your response:</span>
                    <p class="text-secondary small mb-0">Use the <strong>STAR</strong> method: Describe the <strong>Situation</strong>, the <strong>Task</strong> you needed to accomplish, the <strong>Action</strong> you took, and the final <strong>Result</strong> achieved.</p>
                </div>

                <form method="POST" action="/submit_answer">
                    <div class="mb-4">
                        <label for="answer" class="form-label text-muted small fw-medium">Your Answer</label>
                        <textarea class="form-control text-light" id="answer" name="answer" rows="8" placeholder="Type your answer here, explaining your reasoning and experience..." required></textarea>
                    </div>

                    <button type="submit" class="btn btn-indigo w-100 py-2.5 rounded-3 fw-bold">
                        Submit Answer & Evaluate <i class="bi bi-arrow-right-short ms-1"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
