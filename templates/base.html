<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TalentAI | Placement Intelligence Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom Style CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
</head>
<body>

    {% block layout %}
    {% endblock %}

    <!-- Bootstrap 5 Bundle JS (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- SweetAlert2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Global Notification System using SweetAlert2 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    {% for category, message in messages %}
                        Swal.fire({
                            title: '{{ "Success" if category == "success" else ("Error" if category == "error" else ("Warning" if category == "warning" else "Notification")) }}',
                            text: '{{ message|e }}',
                            icon: '{{ "success" if category == "success" else ("error" if category == "error" else ("warning" if category == "warning" else "info")) }}',
                            confirmButtonColor: '#743014',
                            background: '#2C1C11',
                            color: '#E8D1A7',
                            customClass: {
                                popup: 'border-0 rounded-3 bg-glass shadow'
                            }
                        });
                    {% endfor %}
                });
            </script>
        {% endif %}
    {% endwith %}
</body>
</html>
