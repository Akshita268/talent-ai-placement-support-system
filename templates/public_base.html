{% extends "base.html" %}

{% block layout %}
<div class="w-100 d-flex flex-column" style="min-height: 100vh;">
    <!-- Top Navigation -->
    <nav class="navbar navbar-expand-lg py-3 px-4 border-bottom" style="background-color: var(--bg-secondary) !important; border-color: var(--border-color) !important;">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <!-- Left: TalentAI Logo -->
            <a class="d-flex align-items-center gap-2 text-decoration-none" href="/">
                <i class="bi bi-cpu-fill fs-4" style="color: var(--golden-batter);"></i>
                <span class="text-gradient fs-4 fw-extrabold" style="font-family: 'Playfair Display', serif;">TalentAI</span>
            </a>
            
            <!-- Right: Student & Recruiter login links -->
            <div class="d-flex align-items-center gap-3">
                <a href="/student/login" class="text-light text-decoration-none fw-medium fs-6 hover-glow px-2 py-1" style="transition: color 0.2s;">
                    Student Login
                </a>
                <a href="/recruiter/login" class="btn btn-indigo btn-sm py-2 px-3 rounded-3" style="font-size: 0.9rem;">
                    Recruiter Login
                </a>
            </div>
        </div>
    </nav>

        <!-- Main Content Area -->
    <div class="container py-4 flex-grow-1 d-flex flex-column justify-content-center">
        <div class="fade-in w-100">
            {% block body %}
            {% endblock %}
        </div>
    </div>
</div>

<style>
.hover-glow:hover {
    color: var(--golden-batter) !important;
    text-shadow: 0 0 8px rgba(232, 209, 167, 0.4);
}
</style>
{% endblock %}
